name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe manga relay from Pages origin (non-blocking)
        continue-on-error: true
        run: node tests/live-manga-gateway.mjs
      - run: npm run lint
      - run: npm test
      - name: Check instant provider reachability (non-blocking)
        run: node tests/live-provider.mjs
      - name: Probe real episode playback (non-blocking)
        run: node tests/live-playback.mjs
      - name: Check Senshi browser access (non-blocking)
        run: node tests/live-senshi.mjs
      - name: Probe additional sandboxed episode players (non-blocking)
        run: node tests/live-extra-players.mjs
      - name: Probe browser access to reading sources (non-blocking)
        run: node tests/live-readers.mjs
      - name: Probe chronological releases (non-blocking)
        run: node tests/live-releases.mjs
