name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check instant provider reachability (non-blocking)
        run: node tests/live-provider.mjs
      - name: Probe real episode playback (non-blocking)
        run: node tests/live-playback.mjs
      - name: Check Senshi browser access (non-blocking)
        run: node tests/live-senshi.mjs
