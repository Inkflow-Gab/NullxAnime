name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp cache version
        run: sed -i "s/const VERSION = '[^']*';/const VERSION = 'nx-${GITHUB_SHA::7}';/" sw.js

      - name: Assemble static site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js assets vendor _site/
          cp index.html _site/404.html
          node scripts/stamp-release.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
